interface:
  display_name: "AI Paper Writing"
  short_description: "Draft and polish top-tier AI papers"
  # Suggested project file conventions used by this skill.
  # These are defaults, not requirements. If the user defines a different layout in
  # # Custom prompts, follow the user-defined structure instead.
  # - ./Aux: all manuscript materials (references, initial .md project description, and related notes).
  # - ./Aux/Rebuttal: rebuttal package folder.
  # - ./Figs: figure assets.
  # - ./Sec: section .tex files.
  # - ./Aux/Rebuttal/{venue}-Reviews.md or ./Aux/Rebuttal/{venue}-{reviewer}.md: review file(s), either one combined file or one file per reviewer, e.g., ICLR26-Reviews.md or ICLR26-R1.md.
  # - preamble.tex: source of predefined LaTeX macros.
  # - xx.bib: bibliography source used via \bibliography{xx.bib}.
  # - AGENTS.md: Codex local prompt file with project-specific custom prompts written during `init latex`; for other AI tools such as GitHub Copilot or Claude Code, rename or adapt it according to that tool's own instruction-file convention.
  # - .vscode/settings.json: fixed VS Code LaTeX Workshop settings written during `init latex`.
  # - .latexmkrc: fixed local latexmk configuration written during `init latex`.
  # - .gitignore: fixed local ignore rules written during `init latex`.
  # - Aux/Guidelines.pdf: optional formatting guideline reference if provided.
  default_prompt: "Use $ai-paper-writing to draft, polish, or grammar-check my LaTeX manuscript for a target AI venue."
